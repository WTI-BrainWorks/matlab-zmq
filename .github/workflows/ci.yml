name: CI

# Strategy: BUILD on the oldest supported version, then TEST that exact binary on
# newer versions (forward-compatibility), and RELEASE only the floor-built
# binaries. Rationale:
#   * MATLAB mex is forward-compatible (built on an older release runs on newer),
#     so one floor build per OS covers all newer MATLAB.
#   * Octave gives no cross-major-version mex ABI guarantee, so the forward-test
#     jobs will reveal empirically whether the 4.4 binary loads on 7.3 / latest
#     or whether per-version Octave builds are actually required.
#
# libzmq is a git submodule (pinned); BUILD jobs check it out + compile it via
# CMake, TEST jobs don't need it (the MEX statically links it, no rebuild).

on:
  push:
    branches: [ master ]
    tags: ['v*']          # pushing a v* tag also publishes a GitHub Release
  pull_request:
  workflow_dispatch:

jobs:
  # =============================================================== MATLAB =====
  # Build on the floor release per OS (oldest that builds on hosted runners:
  # R2021a needs a libstdc++ preload on Linux; R2022b is the first to support
  # VS2022 on Windows), then forward-test that binary on the latest MATLAB.
  matlab-build:
    name: build · ${{ matrix.os }} · MATLAB ${{ matrix.release }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, release: R2021a, asset: zmq-matlab-linux,
              ldpreload: /usr/lib/x86_64-linux-gnu/libstdc++.so.6 }
          - { os: windows-2022, release: R2022b, asset: zmq-matlab-windows }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
      - name: Build & test
        env:
          # set only for the older Linux cell (empty/no-op elsewhere): makes
          # MATLAB load the system libstdc++ so the gcc-built MEX's GLIBCXX_*
          # requirement resolves on the older bundled libstdc++.
          LD_PRELOAD: ${{ matrix.ldpreload }}
        uses: matlab-actions/run-command@v3
        with:
          command: |
            ok = make;          assert(ok == 1, 'build failed');
            ok = make('test');  assert(ok == 1, 'tests failed');
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: lib                # whole +zmq package (.m shims + built MEX)
          if-no-files-found: error

  matlab-test-forward:
    name: test · ${{ matrix.os }} · MATLAB ${{ matrix.release }}
    needs: matlab-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  release: latest, asset: zmq-matlab-linux }
          - { os: windows-latest, release: latest, asset: zmq-matlab-windows }
    steps:
      - uses: actions/checkout@v7   # make.m, tests/, +zmq shims (no rebuild, no submodule)
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
      - name: Fetch floor-built package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: lib                # overlays the floor-built MEX into lib/+zmq/
      - name: Test floor binary (no rebuild)
        uses: matlab-actions/run-command@v3
        with:
          command: ok = make('test'); assert(ok == 1, 'forward-compat tests failed');

  # =============================================================== Octave =====
  # Build on Octave 4.4 (the psychtoolbox-era floor), then forward-test that
  # exact .mex on 7.3 / latest. Octave's mex ABI is not guaranteed across major
  # versions, so these forward-tests determine whether one binary suffices.
  octave-build:
    name: build · linux · Octave 4.4.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build & test
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work gnuoctave/octave:4.4.1 bash -s <<'EOF'
          command -v cmake >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends cmake build-essential; }
          octave-cli -q --eval "ok = make; assert(ok == 1, 'build failed'); ok = make('test'); assert(ok == 1, 'tests failed');"
          status=$?
          # container runs as root; make the MEX readable by the runner user for upload
          chmod -R a+rX /work/lib || true
          exit $status
          EOF
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: zmq-octave-linux
          path: lib
          if-no-files-found: error

  octave-test-forward:
    name: test · linux · Octave ${{ matrix.octave }}
    needs: octave-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        octave: ['7.3.0', 'latest']
    steps:
      - uses: actions/checkout@v7   # make.m, tests/, +zmq shims (no rebuild, no submodule)
      - name: Fetch 4.4-built package
        uses: actions/download-artifact@v8
        with:
          name: zmq-octave-linux
          path: lib
      - name: Test 4.4 binary on Octave ${{ matrix.octave }} (no rebuild)
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work "gnuoctave/octave:${{ matrix.octave }}" bash -s <<'EOF'
          octave-cli -q --eval "ok = make('test'); assert(ok == 1, 'forward-compat tests failed');"
          EOF

  # MSYS2 is rolling, so we can't pin an old Octave here: build + test + ship the
  # current one. make.m disables ipc:// for MinGW (libzmq guards its Windows ipc
  # headers on _MSC_VER); tcp:// and inproc:// still work.
  octave-windows:
    name: build · windows · Octave (MSYS2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-octave
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build & test
        shell: msys2 {0}
        env:
          CMAKE_GENERATOR: Ninja   # MinGW: single-config; libzmq.a lands in build/lib
        run: |
          octave-cli -q --eval "ok = make; assert(ok == 1, 'build failed'); ok = make('test'); assert(ok == 1, 'tests failed');"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: zmq-octave-windows
          path: lib
          if-no-files-found: error

  # ============================================================== Release =====
  # On a v* tag, publish the floor-built packages (one per platform/engine) as a
  # GitHub Release. Runs only after every build + forward-test passes, so a
  # release implies the shipped binaries are confirmed forward-compatible.
  release:
    name: Publish release
    needs: [matlab-build, matlab-test-forward, octave-build, octave-test-forward, octave-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: zmq-*       # the floor-built / shipped packages

      - name: Zip each package
        run: |
          cd dist
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -qr "../${name}.zip" .)
          done
          ls -la *.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
